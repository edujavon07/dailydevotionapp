name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - coderabbit/update-devotionapp-build-apk/385dbd29

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt 'flet-cli==0.28.3'
          python -m pip check
          python -m py_compile main.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Build the APK
        run: |
          flet build apk --project devotional --org com.edu.devotional \
          --product 'Daily Devotional' --build-version 10.0.0 \
          --build-number "$((100 + ${{ github.run_number }}))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Devotional-App
          path: build/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
